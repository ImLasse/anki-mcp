name: Tests and add-on
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            anki: '25.9.5'
          - os: ubuntu-latest
            anki: '26.9.3'
          - os: windows-latest
            anki: '25.9.5'
          - os: windows-latest
            anki: '26.9.3'
          - os: macos-15
            anki: '26.9.3'
          - os: macos-15-intel
            anki: '26.9.3'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "aqt==${{ matrix.anki }}" PyQt6 PyQt6-WebEngine
      - name: Record actual platform and architecture
        run: python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Lint
        run: |
          ruff check addon scripts tests
          ruff format --check addon scripts tests
      - name: Test real Anki collections, setup dialog and official MCP clients
        run: pytest -q
      - name: Verify generated tool documentation
        run: |
          python scripts/generate_tool_docs.py
          git diff --exit-code -- docs/tools.md docs/tools.json
      - name: Build installable add-on
        run: python scripts/build.py
      - name: Validate Claude extension manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate clients/claude/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: anki-mcp-${{ matrix.os }}-${{ matrix.anki }}
          path: |
            dist/*.ankiaddon
            dist/*.mcpb
